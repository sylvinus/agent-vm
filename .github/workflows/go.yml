name: go

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to a branch or pull request replaces the run in progress, never
# on main: release.sh looks for the run of the commit it releases.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      # The Makefile's TAGS: what ships is what is tested.
      GOFLAGS: -tags=yq_noxml,yq_nolua,yq_noini,yq_nohcl,yq_notoml,yq_noprops,yq_nocsv,yq_nouri,yq_nobase64,yq_nosh,yq_noshell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The steps below run code from the PR branch.
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # The prerequisite checks need QEMU's binary (no VM is booted: the
      # tests run Lima through a fake).
      - name: QEMU
        if: runner.os == 'Windows'
        run: winget install -e --id SoftwareFreedomConservancy.QEMU --version 11.1.0 --silent --accept-package-agreements --accept-source-agreements

      - name: third_party is upstream plus patches/
        if: runner.os == 'Linux'
        run: make check-third-party

      - name: go.mod and go.sum are tidy, and the modules are what go.sum says
        if: runner.os == 'Linux'
        run: |
          go mod tidy -diff
          go mod verify

      # The licenses shipped in each release: every module that goes into the
      # binaries, on the three platforms.
      - name: THIRD_PARTY_LICENSES is up to date
        if: runner.os == 'Linux'
        run: scripts/licenses --check

      # Served as `curl | sh`: plain sh, not bash. shellcheck is on the
      # runner image.
      - name: Shell syntax and shellcheck
        if: runner.os == 'Linux'
        run: |
          for f in agent-vm.sh provision/agent-vm.setup.sh release.sh runtime.example.sh tests/*.sh tests/sftp/run tests/sftp/*.sh scripts/*; do
            echo "bash -n $f"
            bash -n "$f"
          done
          sh -n www/public/install.sh
          shellcheck --version
          shellcheck -S warning agent-vm.sh provision/agent-vm.setup.sh release.sh runtime.example.sh tests/*.sh tests/sftp/run tests/sftp/*.sh scripts/*
          shellcheck -S warning --shell=sh www/public/install.sh

      - name: Build, with the guest agent and templates
        if: runner.os != 'Windows'
        run: make agent-vm

      # No make there: built without the embedded files, whose tests skip.
      - name: Build
        if: runner.os == 'Windows'
        run: go build -o _output/bin/agent-vm.exe ./cmd/agent-vm

      - name: Vet
        run: go vet . ./agents/... ./cmd/... ./internal/... ./policy/... ./provision/...

      - name: Vet for Windows, amd64 and arm64
        if: runner.os == 'Linux'
        run: make check-windows

      # Known vulnerabilities in what the code reaches, in the Linux and
      # Windows builds (macOS's needs cgo and its SDK: it shares the modules).
      - name: govulncheck
        if: runner.os == 'Linux'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
          GOOS=windows govulncheck ./...

      - name: Test
        run: go test . ./agents/... ./cmd/... ./internal/... ./policy/... ./provision/...

      - name: Tests of Lima, sshocker and pkg/sftp, patched
        if: runner.os != 'Windows'
        run: make test-third-party

      # A program that embeds the library, built against this checkout.
      # Its end-to-end test (go test -tags e2e in _output/example) boots a
      # VM: not run here.
      - name: Example program that embeds the library
        if: runner.os == 'Linux'
        run: make test-example

      # Where the file system folds names (APFS, NTFS), it is the oracle of
      # the read-only names' matching; Linux's matches byte for byte.
      - name: Fuzz read-only name matching against the file system
        if: runner.os != 'Linux'
        shell: bash
        run: go test -vet=off -run '^$' -fuzz '^FuzzSameNameFS$' -fuzztime 2m ./third_party/sshocker/pkg/reversesshfs
