name: test

on:
  push:
  pull_request:

# Both jobs only read the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The steps below run test.sh from the PR branch. Leaving the checkout
          # token in .git/config would put it within reach of that code.
          persist-credentials: false

      # For the tests of the zsh shim (tests/03-install.sh).
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Syntax check
        run: |
          for f in agent-vm.sh lib/*.sh agent-vm.setup.sh runtime.example.sh test.sh tests/*.sh test-e2e.sh install.sh release.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done
          # Served as `curl | sh`: plain sh, not bash.
          echo "sh -n www/public/install.sh"
          sh -n www/public/install.sh

      - name: Test suite
        run: ./test.sh

      # macOS still ships bash 3.2, which errors on empty array expansion
      # under `set -u`.
      # Modern bash does not, so a 3.2 run is the only way to catch it in CI.
      # With perl, which macOS ships too: project-env needs it.
      - name: Test suite on bash 3.2 (what macOS ships)
        run: docker run --rm -v "$PWD:/w" -w /w bash:3.2 sh -c 'apk add --no-cache perl >/dev/null && ./test.sh'

  # Windows coverage: the stub suite under Git Bash, which is how agent-vm
  # runs there. No docker (bash 3.2) on a Windows runner, and no
  # real VM anywhere in this workflow (test-e2e.sh stays manual, on every OS).
  test-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          # Same reason as above: test.sh runs code from the PR branch.
          persist-credentials: false

      - name: Syntax check
        run: |
          for f in agent-vm.sh lib/*.sh agent-vm.setup.sh runtime.example.sh test.sh tests/*.sh test-e2e.sh install.sh release.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done
          # Served as `curl | sh`: plain sh, not bash.
          echo "sh -n www/public/install.sh"
          sh -n www/public/install.sh

      - name: Test suite (Git Bash, stub limactl)
        run: ./test.sh
